name: build-mariadb-ctrlc
on:
  push:
    branches: [main]
    paths:
      - mariadb-ctrlc.spec
      - mariadb-restore-ctrlc-exit.patch
      - .github/workflows/rebuild.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install tooling
        run: dnf -y install git copr-cli rpm-build rpmdevtools

      - uses: actions/checkout@v4

      - name: Configure copr-cli
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr

      - name: Build srpm
        run: |
          mkdir -p SOURCES out
          cp mariadb-restore-ctrlc-exit.patch SOURCES/
          spectool -g -C SOURCES mariadb-ctrlc.spec
          rpmbuild --define "_topdir $PWD/rb" --define "_sourcedir $PWD/SOURCES" \
                   --define "_srcrpmdir $PWD/out" -bs mariadb-ctrlc.spec

      - name: Submit to COPR and wait
        run: |
          copr-cli build \
            -r fedora-43-x86_64 -r fedora-43-aarch64 \
            -r fedora-44-x86_64 -r fedora-44-aarch64 \
            -r fedora-rawhide-x86_64 -r fedora-rawhide-aarch64 \
            reversejames/mariadb-ctrlc-exit out/*.src.rpm
